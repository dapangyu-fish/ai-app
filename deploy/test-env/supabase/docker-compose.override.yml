# 测试环境覆盖：
# - kong 直接绑 0.0.0.0:${KONG_HTTP_PORT}，让局域网其他设备也能访问（生产是 127.0.0.1 + nginx）
# - 关掉 studio / analytics / vector / supavisor 之类**纯运维 UI**？—— 不关，按用户要求"不阉割"全保留

services:
  kong:
    ports: !override
      - "0.0.0.0:${KONG_HTTP_PORT}:8000/tcp"
      - "0.0.0.0:${KONG_HTTPS_PORT}:8443/tcp"
  # db 端口也暴一下，方便 psql 调试
  db:
    ports:
      - "0.0.0.0:${POSTGRES_PORT}:5432/tcp"
