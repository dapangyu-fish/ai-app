# 主 compose —— 起 app 自有的 5 个服务：
#   jsonapp-postgres / app-minio / backend / registry / config-center
#
# Supabase 全栈 + OpenIM 全栈走独立 compose project 起（分别 supabase / testenv-openim），
# bootstrap.sh 会按顺序 docker compose -f ... up -d。
#
# 用独立 compose project 而不是 include: 是为了：
# - 各栈 logs / restart 互不打扰
# - kong.yml 等 Supabase 内部相对路径不会被 include 打乱
# - PORT_OFFSET 通过环境变量传给各栈

name: testenv-app

services:
  jsonapp-postgres:
    image: postgres:15.8        # 跟生产一致
    container_name: testenv-jsonapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${JSONAPP_DB_USER}"
      POSTGRES_PASSWORD: "${JSONAPP_DB_PASSWORD}"
      POSTGRES_DB: "${JSONAPP_DB_NAME}"
    ports:
      - "${JSONAPP_DB_PORT}:5432"
    volumes:
      - jsonapp_pg_data:/var/lib/postgresql/data
      - ../../backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./_migrations:/docker-entrypoint-initdb.d/02-migrations/:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app-minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z   # 跟 prod 同档 LTS
    container_name: testenv-app-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: "${APP_MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${APP_MINIO_ROOT_PASSWORD}"
      # 关键：让 presigned URL 用客户端能访问的 IP，不是容器内 hostname
      MINIO_SERVER_URL: "http://${HOST_IP}:${APP_MINIO_PORT}"
      MINIO_BROWSER_REDIRECT_URL: "http://${HOST_IP}:${APP_MINIO_CONSOLE_PORT}"
    command: server /data --console-address ":9090"
    volumes:
      - app_minio_data:/data
    ports:
      - "${APP_MINIO_PORT}:9000"
      - "${APP_MINIO_CONSOLE_PORT}:9090"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../../
      dockerfile: deploy/test-env/Dockerfile.backend
    container_name: testenv-backend
    restart: unless-stopped
    depends_on:
      jsonapp-postgres:
        condition: service_healthy
      app-minio:
        condition: service_started
    command: ["python", "/app/backend/app.py"]
    environment:
      # ── 主数据库 ──
      DB_HOST: jsonapp-postgres
      DB_PORT: "5432"
      DB_NAME: "${JSONAPP_DB_NAME}"
      DB_USER: "${JSONAPP_DB_USER}"
      DB_PASSWORD: "${JSONAPP_DB_PASSWORD}"
      # ── Supabase（容器互通走 supabase 默认 network 名）──
      SUPABASE_URL: "http://${HOST_IP}:${KONG_HTTP_PORT}"
      SUPABASE_ANON_KEY: "${SUPABASE_ANON_KEY}"
      SUPABASE_SERVICE_KEY: "${SUPABASE_SERVICE_ROLE_KEY}"
      SUPABASE_JWT_SECRET: "${JWT_SECRET}"
      # ── MinIO ──
      MINIO_ENDPOINT: "${HOST_IP}:${APP_MINIO_PORT}"
      MINIO_ACCESS_KEY: "${APP_MINIO_ACCESS_KEY}"
      MINIO_SECRET_KEY: "${APP_MINIO_SECRET_KEY}"
      MINIO_USE_SSL: "false"
      MINIO_PUBLIC_ENDPOINT: "http://${HOST_IP}:${APP_MINIO_PORT}"
      # ── OpenIM ──
      OPENIM_API_URL: "http://${HOST_IP}:${OPENIM_API_PORT}"
      OPENIM_WS_URL: "ws://${HOST_IP}:${OPENIM_WS_PORT}"
      OPENIM_ADMIN_URL: "http://${HOST_IP}:${OPENIM_ADMIN_PORT}"
      OPENIM_SECRET: "${OPENIM_SECRET}"
      OPENIM_WEBHOOK_SECRET: "${OPENIM_WEBHOOK_SECRET}"
      # ── Flask ──
      FLASK_SECRET_KEY: "${FLASK_SECRET_KEY}"
      FLASK_ENV: "production"
      # ── AI providers（DeepSeek 必填，其他空也行）──
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY}"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      GLM_API_KEY: "${GLM_API_KEY}"
      DOUBAO_API_KEY: "${DOUBAO_API_KEY}"
      # ── ByteDance ASR（空就不启用）──
      BYTEDANCE_ASR_APP_KEY: "${BYTEDANCE_ASR_APP_KEY}"
      BYTEDANCE_ASR_ACCESS_KEY: "${BYTEDANCE_ASR_ACCESS_KEY}"
      BYTEDANCE_ASR_RESOURCE_ID: "${BYTEDANCE_ASR_RESOURCE_ID}"
      # ── push 全部不配，is_supported 自然返回 [] ──
    ports:
      - "${BACKEND_PORT}:5566"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5566/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - default
      - supabase_default
      - testenv-openim_default

  registry:
    build:
      context: ../../
      dockerfile: deploy/test-env/Dockerfile.backend
    container_name: testenv-registry
    restart: unless-stopped
    depends_on:
      jsonapp-postgres:
        condition: service_healthy
    command: ["python", "/app/backend/registry_server.py"]
    environment:
      DB_HOST: jsonapp-postgres
      DB_PORT: "5432"
      DB_NAME: "${JSONAPP_DB_NAME}"
      DB_USER: "${JSONAPP_DB_USER}"
      DB_PASSWORD: "${JSONAPP_DB_PASSWORD}"
      MINIO_ENDPOINT: "${HOST_IP}:${APP_MINIO_PORT}"
      MINIO_ACCESS_KEY: "${APP_MINIO_ACCESS_KEY}"
      MINIO_SECRET_KEY: "${APP_MINIO_SECRET_KEY}"
      MINIO_USE_SSL: "false"
      MINIO_PUBLIC_ENDPOINT: "http://${HOST_IP}:${APP_MINIO_PORT}"
      REGISTRY_ADMIN_TOKEN: "${REGISTRY_ADMIN_TOKEN}"
      SUPABASE_URL: "http://${HOST_IP}:${KONG_HTTP_PORT}"
      SUPABASE_JWT_SECRET: "${JWT_SECRET}"
      FLASK_SECRET_KEY: "${FLASK_SECRET_KEY}"
    ports:
      - "${REGISTRY_PORT}:3254"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3254/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  config-center:
    build:
      context: ../../
      dockerfile: deploy/test-env/Dockerfile.backend
    container_name: testenv-config-center
    restart: unless-stopped
    command: ["python", "/app/config_center/app.py"]
    environment:
      FLASK_ENV: "production"
      CONFIG_CENTER_PORT: "5000"
    ports:
      - "${CONFIG_CENTER_PORT}:5000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/api/v1/public"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  jsonapp_pg_data:
  app_minio_data:

# 跨 compose project 互通：声明 supabase 和 openim 的 default network 为外部
networks:
  default:
  supabase_default:
    external: true
  testenv-openim_default:
    external: true
