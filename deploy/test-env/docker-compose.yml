# 主 compose —— 起 app 自有的 6 个服务：
#   jsonapp-postgres / app-minio / backend-redis / backend / registry / config-center
#
# Supabase 全栈 + OpenIM 全栈走独立 compose project 起（分别 supabase / testenv-openim），
# bootstrap.sh 会按顺序 docker compose -f ... up -d。

name: testenv-app

services:
  jsonapp-postgres:
    image: postgres:15.8
    container_name: testenv-jsonapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${JSONAPP_DB_USER}"
      POSTGRES_PASSWORD: "${JSONAPP_DB_PASSWORD}"
      POSTGRES_DB: "${JSONAPP_DB_NAME}"
    ports:
      - "${JSONAPP_DB_PORT}:5432"
    volumes:
      - jsonapp_pg_data:/var/lib/postgresql/data
      - ../../backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-redis:
    # backend 用来缓存 AI 会话状态（config.py: AI_SESSION_REDIS_*）
    # 跟 OpenIM redis 分开，避免相互踩 key 空间
    # 镜像版本跟 prod ai-session-redis 容器一致
    image: redis:7.4-alpine
    container_name: testenv-backend-redis
    restart: unless-stopped
    command: redis-server --requirepass "${BACKEND_REDIS_PASSWORD}" --appendonly yes
    volumes:
      - backend_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${BACKEND_REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app-minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z   # 与 prod app-minio 一致
    container_name: testenv-app-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: "${APP_MINIO_ROOT_USER}"
      MINIO_ROOT_PASSWORD: "${APP_MINIO_ROOT_PASSWORD}"
      # 关键：让 presigned URL 用客户端能访问的 IP，不是容器内 hostname
      MINIO_SERVER_URL: "http://${HOST_IP}:${APP_MINIO_PORT}"
      MINIO_BROWSER_REDIRECT_URL: "http://${HOST_IP}:${APP_MINIO_CONSOLE_PORT}"
    command: server /data --console-address ":9090"
    volumes:
      - app_minio_data:/data
    ports:
      - "${APP_MINIO_PORT}:9000"
      - "${APP_MINIO_CONSOLE_PORT}:9090"
    # minio:RELEASE.2025+ server 镜像被精简到 distroless 风格，wget/curl/mc 全不在
    # PATH，官方也没在 server 镜像里塞 healthcheck。backend 是 depends_on
    # service_started（不依赖 healthy 标签），所以这里干脆不配 healthcheck，
    # 避免假 "unhealthy" 显示混淆视听。

  backend:
    build:
      context: ../../
      dockerfile: deploy/test-env/Dockerfile.backend
    container_name: testenv-backend
    restart: unless-stopped
    depends_on:
      jsonapp-postgres:
        condition: service_healthy
      backend-redis:
        condition: service_healthy
      app-minio:
        condition: service_started
    working_dir: /app/backend
    command: ["python", "app.py"]
    environment:
      # ── jsonapp Postgres ──
      DB_HOST: jsonapp-postgres
      DB_PORT: "5432"
      DB_NAME: "${JSONAPP_DB_NAME}"
      DB_USER: "${JSONAPP_DB_USER}"
      DB_PASSWORD: "${JSONAPP_DB_PASSWORD}"
      # ── AI 会话 Redis（backend/config.py: AI_SESSION_REDIS_*）──
      AI_SESSION_REDIS_HOST: backend-redis
      AI_SESSION_REDIS_PORT: "6379"
      AI_SESSION_REDIS_PASSWORD: "${BACKEND_REDIS_PASSWORD}"
      AI_SESSION_REDIS_TTL_SECONDS: "86400"
      AI_WORKER_MAX_CONCURRENCY: "200"
      # ── Supabase（backend 用 config.py 读 SUPABASE_URL/ANON/SERVICE）──
      SUPABASE_URL: "http://${HOST_IP}:${KONG_HTTP_PORT}"
      SUPABASE_ANON_KEY: "${SUPABASE_ANON_KEY}"
      SUPABASE_SERVICE_KEY: "${SUPABASE_SERVICE_ROLE_KEY}"
      # ── MinIO（backend/config.py: MINIO_PUBLIC_URL / ACCESS / SECRET）──
      MINIO_PUBLIC_URL: "http://${HOST_IP}:${APP_MINIO_PORT}"
      MINIO_ACCESS_KEY: "${APP_MINIO_ACCESS_KEY}"
      MINIO_SECRET_KEY: "${APP_MINIO_SECRET_KEY}"
      # ── Registry（backend/config.py: REGISTRY_BASE_URL；用于 store.py deprecated
      # 接口的 new_endpoint + prompt 渲染）──
      REGISTRY_BASE_URL: "http://${HOST_IP}:${REGISTRY_PORT}"
      # ── OpenIM ──
      OPENIM_API_URL: "http://${HOST_IP}:${OPENIM_API_PORT}"
      OPENIM_WS_URL: "ws://${HOST_IP}:${OPENIM_WS_PORT}"
      OPENIM_SECRET: "${OPENIM_SECRET}"
      OPENIM_WEBHOOK_SECRET: "${OPENIM_WEBHOOK_SECRET}"
      # ── Flask ──
      FLASK_SECRET_KEY: "${FLASK_SECRET_KEY}"
      PORT: "5566"
      # ── AI 供应商：backend 只认 DEEPSEEK_KEY / GLM_ANTHROPIC_* / CC_ANTHROPIC_* ──
      DEEPSEEK_KEY: "${DEEPSEEK_KEY}"
      GLM_ANTHROPIC_AUTH_TOKEN: "${GLM_ANTHROPIC_AUTH_TOKEN}"
      GLM_ANTHROPIC_BASE_URL: "${GLM_ANTHROPIC_BASE_URL}"
      CC_ANTHROPIC_AUTH_TOKEN: "${CC_ANTHROPIC_AUTH_TOKEN}"
      CC_ANTHROPIC_BASE_URL: "${CC_ANTHROPIC_BASE_URL}"
      # ── ByteDance ASR（空就不启用）──
      BYTEDANCE_ASR_APP_KEY: "${BYTEDANCE_ASR_APP_KEY}"
      BYTEDANCE_ASR_ACCESS_KEY: "${BYTEDANCE_ASR_ACCESS_KEY}"
      BYTEDANCE_ASR_RESOURCE_ID: "${BYTEDANCE_ASR_RESOURCE_ID}"
      # ── APNs / push 不配，is_supported 返回 [] ──
    ports:
      - "${BACKEND_PORT}:5566"
    healthcheck:
      # backend 自己没 /health，用 /api/ai/providers（不需鉴权，列供应商）
      test: ["CMD", "curl", "-fsS", "http://localhost:5566/api/ai/providers"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - default
      - supabase_default
      - testenv-openim_default

  registry:
    build:
      context: ../../
      dockerfile: deploy/test-env/Dockerfile.backend
    container_name: testenv-registry
    restart: unless-stopped
    depends_on:
      jsonapp-postgres:
        condition: service_healthy
    working_dir: /app/backend
    command: ["python", "registry_server.py"]
    environment:
      DB_HOST: jsonapp-postgres
      DB_PORT: "5432"
      DB_NAME: "${JSONAPP_DB_NAME}"
      DB_USER: "${JSONAPP_DB_USER}"
      DB_PASSWORD: "${JSONAPP_DB_PASSWORD}"
      MINIO_PUBLIC_URL: "http://${HOST_IP}:${APP_MINIO_PORT}"
      MINIO_ACCESS_KEY: "${APP_MINIO_ACCESS_KEY}"
      MINIO_SECRET_KEY: "${APP_MINIO_SECRET_KEY}"
      REGISTRY_ADMIN_TOKEN: "${REGISTRY_ADMIN_TOKEN}"
      # 自己对外的 base URL（mirror manifest 里嵌的 URL 用它，让下游链式镜像找回这里）
      REGISTRY_BASE_URL: "http://${HOST_IP}:${REGISTRY_PORT}"
      # ── Mirror 配置 ── 空字符串 = 不开 mirror；非空 = 周期性同步上游 manifest
      REGISTRY_UPSTREAM: "${REGISTRY_UPSTREAM}"
      REGISTRY_MIRROR_SYNC_INTERVAL_SEC: "${REGISTRY_MIRROR_SYNC_INTERVAL_SEC}"
      SUPABASE_URL: "http://${HOST_IP}:${KONG_HTTP_PORT}"
      SUPABASE_ANON_KEY: "${SUPABASE_ANON_KEY}"
      SUPABASE_SERVICE_KEY: "${SUPABASE_SERVICE_ROLE_KEY}"
      FLASK_SECRET_KEY: "${FLASK_SECRET_KEY}"
    ports:
      - "${REGISTRY_PORT}:3254"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3254/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  config-center:
    build:
      context: ../../
      dockerfile: deploy/test-env/Dockerfile.backend
    container_name: testenv-config-center
    restart: unless-stopped
    working_dir: /app/config_center
    command: ["python", "app.py"]
    environment:
      # config_center/app.py 强制要求 ADMIN_PASSWORD + SESSION_SECRET，缺就 exit
      ADMIN_USERNAME: "admin"
      ADMIN_PASSWORD: "${CONFIG_CENTER_ADMIN_PASSWORD}"
      SESSION_SECRET: "${CONFIG_CENTER_SESSION_SECRET}"
      LISTEN_HOST: "0.0.0.0"
      LISTEN_PORT: "5000"
      DB_PATH: "/data/config.db"
    volumes:
      - config_center_data:/data
    ports:
      - "${CONFIG_CENTER_PORT}:5000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5000/api/v1/public"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  user-center:
    # Supabase 用户管理后台 —— 改 role / ban / 重置密码邮件。生产用 gunicorn + supervisor，
    # 测试环境跟 config-center 同样跑 python app.py 即可（admin 工具，低流量）
    build:
      context: ../../
      dockerfile: deploy/test-env/Dockerfile.backend
    container_name: testenv-user-center
    restart: unless-stopped
    working_dir: /app/user_center
    command: ["python", "app.py"]
    environment:
      # app.py 强制要求 ADMIN_PASSWORD + SESSION_SECRET，缺就 exit
      ADMIN_USERNAME: "admin"
      ADMIN_PASSWORD: "${USER_CENTER_ADMIN_PASSWORD}"
      SESSION_SECRET: "${USER_CENTER_SESSION_SECRET}"
      LISTEN_HOST: "0.0.0.0"
      LISTEN_PORT: "8089"
      DB_PATH: "/data/audit.db"
      # 测试环境裸 HTTP；secure cookie 会被浏览器丢弃 → 登录看似无错但跳回登录页
      COOKIE_SECURE: "false"
      # 通过 Kong 调 Supabase Admin API（GoTrue 在 Kong 后面）
      SUPABASE_URL: "http://${HOST_IP}:${KONG_HTTP_PORT}"
      SUPABASE_SERVICE_KEY: "${SUPABASE_SERVICE_ROLE_KEY}"
    volumes:
      - user_center_data:/data
    ports:
      - "${USER_CENTER_PORT}:8089"
    healthcheck:
      # / 未登录时 302 → /login，curl -f 不接 3xx，用 -L 跟跳
      test: ["CMD", "curl", "-fsSL", "http://localhost:8089/login"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  jsonapp_pg_data:
  backend_redis_data:
  app_minio_data:
  config_center_data:
  user_center_data:

networks:
  default:
  supabase_default:
    external: true
  testenv-openim_default:
    external: true
