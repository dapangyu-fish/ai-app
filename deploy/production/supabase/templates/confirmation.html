<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyApp verification code</title>
  </head>
  <body style="margin:0;padding:0;background:#f4f6f8;color:#111827;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="width:100%;background:#f4f6f8;margin:0;padding:0;">
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="width:100%;max-width:520px;background:#ffffff;border-radius:20px;border:1px solid #e5e7eb;overflow:hidden;box-shadow:0 18px 48px rgba(15,23,42,0.08);">
            <tr>
              <td style="padding:28px 32px 18px 32px;background:#0f172a;">
                <div style="font-size:13px;letter-spacing:0.08em;text-transform:uppercase;color:#93c5fd;font-weight:700;">MyApp</div>
                <h1 style="margin:10px 0 0 0;color:#ffffff;font-size:24px;line-height:1.28;font-weight:750;">验证你的邮箱</h1>
              </td>
            </tr>
            <tr>
              <td style="padding:30px 32px 8px 32px;">
                <p style="margin:0;color:#374151;font-size:16px;line-height:1.7;">你正在注册或登录 MyApp。请在应用内输入下面的验证码完成邮箱验证。</p>
              </td>
            </tr>
            <tr>
              <td style="padding:18px 32px 18px 32px;">
                <div style="background:#f8fafc;border:1px solid #e2e8f0;border-radius:16px;padding:22px 16px;text-align:center;">
                  <div style="color:#64748b;font-size:13px;line-height:1.4;margin-bottom:10px;">Verification code</div>
                  <div style="font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;color:#0f172a;font-size:34px;line-height:1.1;font-weight:800;letter-spacing:0.24em;">{{ .Token }}</div>
                </div>
              </td>
            </tr>
            <tr>
              <td style="padding:0 32px 28px 32px;">
                <p style="margin:0;color:#64748b;font-size:14px;line-height:1.7;">验证码 24 小时内有效。为了账号安全，请不要把验证码转发给任何人。</p>
                <p style="margin:14px 0 0 0;color:#64748b;font-size:14px;line-height:1.7;">如果这不是你本人操作，可以直接忽略这封邮件。</p>
              </td>
            </tr>
            <tr>
              <td style="padding:18px 32px;background:#f8fafc;border-top:1px solid #e5e7eb;">
                <p style="margin:0;color:#94a3b8;font-size:12px;line-height:1.6;">This email contains a one-time verification code only. MyApp will never ask for your password by email.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
