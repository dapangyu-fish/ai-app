;; pgbouncer-platform — 平台面连接池（后端常规 CRUD → jsonapp）
;; session 池 + auth_query。不发布端口，仅 myapp_default 内可达（超级用户池不出内网）。
;; DDL/provision/advisory-lock 不走这里——它们经 DB_DIRECT_* 直连 jsonapp-postgres。
;; 详见 docs/planning/pgbouncer-jsonapp-postgres.md
[databases]
jsonapp = host=jsonapp-postgres port=5432 dbname=jsonapp pool_mode=session

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

auth_type   = scram-sha-256
auth_file   = /etc/pgbouncer/userlist.txt
auth_user   = pgbouncer_auth
auth_dbname = jsonapp
auth_query  = SELECT uname, phash FROM pgbouncer.user_lookup($1)

pool_mode                 = session
default_pool_size         = 25
min_pool_size             = 0
reserve_pool_size         = 5
max_db_connections        = 40
max_client_conn           = 500
server_idle_timeout       = 60
server_lifetime           = 1800
server_connect_timeout    = 5
ignore_startup_parameters = extra_float_digits,options

admin_users = pgbouncer_auth
stats_users = pgbouncer_auth
