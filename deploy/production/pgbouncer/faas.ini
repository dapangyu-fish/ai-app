;; pgbouncer-faas — 租户面连接池（FaaS 运行时 u_* → userdata）
;; transaction 池 + auth_query 动态认证。发布在 172.18.0.1:6432，供函数容器跨网络访问。
;; 详见 docs/planning/pgbouncer-jsonapp-postgres.md
[databases]
userdata = host=jsonapp-postgres port=5432 dbname=userdata pool_mode=transaction

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

auth_type   = scram-sha-256
auth_file   = /etc/pgbouncer/userlist.txt
auth_user   = pgbouncer_auth
auth_dbname = userdata
auth_query  = SELECT uname, phash FROM pgbouncer.user_lookup($1)

pool_mode                 = transaction
default_pool_size         = 5
min_pool_size             = 0
reserve_pool_size         = 3
reserve_pool_timeout      = 3
max_db_connections        = 50
max_client_conn           = 2000
server_idle_timeout       = 30
server_lifetime           = 1800
server_connect_timeout    = 5
server_reset_query        = DISCARD ALL
server_reset_query_always = 0
ignore_startup_parameters = extra_float_digits,options

admin_users = pgbouncer_auth
stats_users = pgbouncer_auth
