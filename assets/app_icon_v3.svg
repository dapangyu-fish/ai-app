<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 - 深灰色 -->
  <rect width="1024" height="1024" rx="226" fill="#1a1a1a"/>

  <!-- 渐变定义 -->
  <defs>
    <linearGradient id="grad" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a0a0a0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 简化的手势 - 三根手指向上 -->
  <g transform="translate(512, 512)">
    <!-- 手掌底部 -->
    <ellipse cx="0" cy="180" rx="140" ry="80" fill="url(#grad)" opacity="0.9"/>

    <!-- 左手指 -->
    <rect x="-120" y="-80" width="70" height="260" rx="35" fill="url(#grad)" opacity="0.95"/>

    <!-- 中手指 -->
    <rect x="-35" y="-140" width="70" height="320" rx="35" fill="url(#grad)" opacity="0.95"/>

    <!-- 右手指 -->
    <rect x="50" y="-80" width="70" height="260" rx="35" fill="url(#grad)" opacity="0.95"/>

    <!-- 代码符号 - 在手掌上 -->
    <text x="0" y="200" font-family="monospace" font-size="80" fill="#2a2a2a" text-anchor="middle" opacity="0.5">{}</text>
  </g>
</svg>
