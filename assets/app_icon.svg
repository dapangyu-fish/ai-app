<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景渐变 -->
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bracket-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e7ff;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 圆角矩形背景 -->
  <rect width="1024" height="1024" rx="180" fill="url(#bg-gradient)"/>

  <!-- JSON 大括号 - 左 -->
  <path d="M 320 256 Q 280 256 280 296 L 280 456 Q 280 496 240 496 Q 280 496 280 536 L 280 696 Q 280 736 320 736"
        stroke="url(#bracket-gradient)"
        stroke-width="48"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"/>

  <!-- JSON 大括号 - 右 -->
  <path d="M 704 256 Q 744 256 744 296 L 744 456 Q 744 496 784 496 Q 744 496 744 536 L 744 696 Q 744 736 704 736"
        stroke="url(#bracket-gradient)"
        stroke-width="48"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"/>

  <!-- 中间的代码符号 -->
  <circle cx="512" cy="380" r="24" fill="white" opacity="0.9"/>
  <circle cx="512" cy="496" r="24" fill="white" opacity="0.9"/>
  <circle cx="512" cy="612" r="24" fill="white" opacity="0.9"/>

  <!-- 装饰性的小方块 -->
  <rect x="420" y="368" width="32" height="32" rx="6" fill="white" opacity="0.7"/>
  <rect x="572" y="368" width="32" height="32" rx="6" fill="white" opacity="0.7"/>
  <rect x="420" y="484" width="32" height="32" rx="6" fill="white" opacity="0.7"/>
  <rect x="572" y="484" width="32" height="32" rx="6" fill="white" opacity="0.7"/>
  <rect x="420" y="600" width="32" height="32" rx="6" fill="white" opacity="0.7"/>
  <rect x="572" y="600" width="32" height="32" rx="6" fill="white" opacity="0.7"/>
</svg>
