<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 - 深灰色 -->
  <rect width="1024" height="1024" rx="226" fill="#1a1a1a"/>

  <!-- 渐变定义 -->
  <defs>
    <linearGradient id="palmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b8b8b8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 侧面手掌 - 类似 Manus 风格 -->
  <g transform="translate(512, 512)">
    <!-- 手掌主体 -->
    <path d="M -80 -100 Q -120 -80 -140 -40 L -160 80 Q -160 140 -120 180 L 0 200 Q 60 200 100 160 L 120 100 Q 120 40 100 0 L 80 -60 Q 60 -100 20 -120 L -40 -120 Q -60 -120 -80 -100 Z"
          fill="url(#palmGrad)"/>

    <!-- 大拇指 -->
    <path d="M -140 -40 Q -180 -60 -200 -100 Q -210 -140 -190 -180 Q -170 -200 -140 -190 Q -110 -180 -100 -150 L -100 -80 Q -100 -50 -120 -30 L -140 -40 Z"
          fill="url(#palmGrad)"/>

    <!-- 食指 -->
    <ellipse cx="20" cy="-140" rx="35" ry="50" fill="url(#palmGrad)"/>

    <!-- 中指 -->
    <ellipse cx="60" cy="-160" rx="35" ry="55" fill="url(#palmGrad)"/>

    <!-- 无名指 -->
    <ellipse cx="100" cy="-140" rx="32" ry="48" fill="url(#palmGrad)"/>

    <!-- 小指 -->
    <ellipse cx="135" cy="-110" rx="28" ry="42" fill="url(#palmGrad)"/>

    <!-- 代码符号 - 在手掌上 -->
    <g opacity="0.3">
      <path d="M -60 60 L -50 60 L -50 80 L -60 80 L -70 80 L -70 100 L -60 100 L -50 100 L -50 120 L -60 120"
            stroke="#1a1a1a"
            stroke-width="4"
            stroke-linecap="round"
            fill="none"/>
      <path d="M 20 60 L 30 60 L 30 80 L 20 80 L 10 80 L 10 100 L 20 100 L 30 100 L 30 120 L 20 120"
            stroke="#1a1a1a"
            stroke-width="4"
            stroke-linecap="round"
            fill="none"/>
      <circle cx="-15" cy="90" r="4" fill="#1a1a1a"/>
    </g>
  </g>
</svg>
