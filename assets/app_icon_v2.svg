<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="1024" height="1024" rx="226" fill="#6366f1"/>

  <!-- JSON 大括号和代码元素 -->
  <g transform="translate(512, 512)">
    <!-- 左大括号 -->
    <path d="M -200 -240 Q -240 -240 -240 -200 L -240 -40 Q -240 0 -280 0 Q -240 0 -240 40 L -240 200 Q -240 240 -200 240"
          stroke="white"
          stroke-width="56"
          stroke-linecap="round"
          stroke-linejoin="round"
          fill="none"
          opacity="0.95"/>

    <!-- 右大括号 -->
    <path d="M 200 -240 Q 240 -240 240 -200 L 240 -40 Q 240 0 280 0 Q 240 0 240 40 L 240 200 Q 240 240 200 240"
          stroke="white"
          stroke-width="56"
          stroke-linecap="round"
          stroke-linejoin="round"
          fill="none"
          opacity="0.95"/>

    <!-- 中间的 UI 元素符号 -->
    <!-- 顶部矩形 -->
    <rect x="-80" y="-140" width="160" height="40" rx="8" fill="white" opacity="0.85"/>

    <!-- 中间两个小矩形 -->
    <rect x="-80" y="-60" width="70" height="40" rx="8" fill="white" opacity="0.75"/>
    <rect x="10" y="-60" width="70" height="40" rx="8" fill="white" opacity="0.75"/>

    <!-- 底部矩形 -->
    <rect x="-80" y="20" width="160" height="40" rx="8" fill="white" opacity="0.85"/>

    <!-- 装饰圆点 -->
    <circle cx="0" cy="100" r="12" fill="white" opacity="0.9"/>
    <circle cx="-40" cy="100" r="12" fill="white" opacity="0.7"/>
    <circle cx="40" cy="100" r="12" fill="white" opacity="0.7"/>
  </g>
</svg>
