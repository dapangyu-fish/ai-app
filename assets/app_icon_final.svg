<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 - 深灰色 -->
  <rect width="1024" height="1024" rx="226" fill="#1a1a1a"/>

  <!-- 渐变定义 -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e5e5e5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a0a0a0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 主图形 - 类似 Manus 的简洁几何风格 -->
  <g transform="translate(512, 512)">
    <!-- 外层大括号 - 左 -->
    <path d="M -280 -280 L -240 -280 L -240 -240 L -240 -80 L -240 -40 L -280 -40 L -320 -40 L -320 0 L -280 0 L -240 0 L -240 40 L -240 80 L -240 240 L -240 280 L -280 280"
          stroke="url(#grad1)"
          stroke-width="40"
          stroke-linecap="round"
          stroke-linejoin="round"
          fill="none"/>

    <!-- 外层大括号 - 右 -->
    <path d="M 280 -280 L 240 -280 L 240 -240 L 240 -80 L 240 -40 L 280 -40 L 320 -40 L 320 0 L 280 0 L 240 0 L 240 40 L 240 80 L 240 240 L 240 280 L 280 280"
          stroke="url(#grad1)"
          stroke-width="40"
          stroke-linecap="round"
          stroke-linejoin="round"
          fill="none"/>

    <!-- 中间的抽象 UI 元素 -->
    <!-- 顶部横条 -->
    <rect x="-140" y="-160" width="280" height="32" rx="16" fill="#e5e5e5" opacity="0.9"/>

    <!-- 中间三个小方块 -->
    <rect x="-140" y="-60" width="80" height="32" rx="8" fill="#d0d0d0" opacity="0.85"/>
    <rect x="-20" y="-60" width="80" height="32" rx="8" fill="#d0d0d0" opacity="0.85"/>
    <rect x="60" y="-60" width="80" height="32" rx="8" fill="#d0d0d0" opacity="0.85"/>

    <!-- 中间横条 -->
    <rect x="-140" y="40" width="280" height="32" rx="16" fill="#e5e5e5" opacity="0.9"/>

    <!-- 底部三个圆点 -->
    <circle cx="-80" cy="140" r="16" fill="#c0c0c0" opacity="0.8"/>
    <circle cx="0" cy="140" r="16" fill="#c0c0c0" opacity="0.8"/>
    <circle cx="80" cy="140" r="16" fill="#c0c0c0" opacity="0.8"/>
  </g>
</svg>
