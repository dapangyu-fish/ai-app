<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 - 深灰色 -->
  <rect width="1024" height="1024" rx="226" fill="#1a1a1a"/>

  <!-- 渐变定义 -->
  <defs>
    <linearGradient id="handGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#e0e0e0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b0b0b0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 极简手势 - 只用三根手指 -->
  <g transform="translate(512, 600)">
    <!-- 左手指 -->
    <rect x="-140" y="-400" width="80" height="400" rx="40" fill="url(#handGradient)"/>

    <!-- 中手指（稍高） -->
    <rect x="-40" y="-480" width="80" height="480" rx="40" fill="url(#handGradient)"/>

    <!-- 右手指 -->
    <rect x="60" y="-400" width="80" height="400" rx="40" fill="url(#handGradient)"/>

    <!-- 手掌底部 -->
    <ellipse cx="0" cy="20" rx="160" ry="60" fill="url(#handGradient)"/>
  </g>
</svg>
