<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 - 深灰色 -->
  <rect width="1024" height="1024" rx="226" fill="#1a1a1a"/>

  <!-- 渐变定义 -->
  <defs>
    <linearGradient id="fingerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0c0c0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 极简手势 - 三根手指向上，代表触控交互 -->
  <g transform="translate(512, 512)">
    <!-- 左手指 -->
    <rect x="-150" y="-180" width="60" height="360" rx="30" fill="url(#fingerGrad)"/>

    <!-- 中手指（最高） -->
    <rect x="-30" y="-240" width="60" height="420" rx="30" fill="url(#fingerGrad)"/>

    <!-- 右手指 -->
    <rect x="90" y="-180" width="60" height="360" rx="30" fill="url(#fingerGrad)"/>
  </g>
</svg>
