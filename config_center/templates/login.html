<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · 配置中心</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      background: #f5f5f7; margin: 0; padding: 0;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      color: #1d1d1f;
    }
    .card {
      background: #fff; padding: 36px 32px; border-radius: 14px;
      box-shadow: 0 4px 24px rgba(0,0,0,.08); width: 340px;
    }
    h1 { margin: 0 0 8px; font-size: 22px; text-align: center; font-weight: 600; }
    .sub { margin: 0 0 24px; font-size: 13px; color: #86868b; text-align: center; }
    label { display: block; font-size: 13px; color: #555; margin: 14px 0 6px; }
    input[type="text"], input[type="password"] {
      width: 100%; padding: 11px 12px; border: 1px solid #d2d2d7; border-radius: 8px;
      font-size: 14px; font-family: inherit; transition: border-color .15s;
    }
    input:focus { outline: none; border-color: #0071e3; }
    button {
      margin-top: 22px; width: 100%; padding: 12px;
      background: #0071e3; color: #fff; border: none; border-radius: 8px;
      font-size: 15px; font-weight: 500; cursor: pointer;
    }
    button:hover { background: #0058b3; }
    .err {
      background: #fff1f0; color: #b00020; padding: 10px 12px;
      border-radius: 8px; font-size: 13px; margin-bottom: 4px;
    }
  </style>
</head>
<body>
  <form class="card" method="post" action="/login">
    <h1>📦 配置中心</h1>
    <p class="sub">公共配置下发 · 紧急熔断</p>
    {% if error == 'invalid' %}<div class="err">用户名或密码错误</div>{% endif %}
    {% if error == 'rate_limited' %}<div class="err">登录尝试过多，请 15 分钟后再试</div>{% endif %}
    <label>用户名</label>
    <input name="username" type="text" autofocus required autocomplete="username">
    <label>密码</label>
    <input name="password" type="password" required autocomplete="current-password">
    <button type="submit">登录</button>
  </form>
</body>
</html>
