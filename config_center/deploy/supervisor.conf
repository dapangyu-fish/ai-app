; 部署到 /etc/supervisor/conf.d/config-center.conf
; 然后：supervisorctl reread && supervisorctl update && supervisorctl restart config-center

[program:config-center]
command=/opt/miniconda3/bin/gunicorn -c /root/ai-app/config_center/gunicorn_conf.py app:app
directory=/root/ai-app/config_center
user=root
autostart=true
autorestart=true
stdout_logfile=/var/log/config-center/config-center.log
stderr_logfile=/var/log/config-center/config-center-error.log
environment=CONFIG_CENTER_ENV_PATH="/etc/config-center/.env",PATH="/opt/miniconda3/bin",PYTHONUNBUFFERED="1"
