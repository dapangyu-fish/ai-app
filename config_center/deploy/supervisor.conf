; 部署到 /etc/supervisor/conf.d/config-center.conf
; 然后：supervisorctl reread && supervisorctl update && supervisorctl start config-center

[program:config-center]
command=/opt/miniconda3/bin/python /root/ai-app/config_center/app.py
directory=/root/ai-app
user=root
autostart=true
autorestart=true
stdout_logfile=/var/log/config-center/config-center.log
stderr_logfile=/var/log/config-center/config-center-error.log
environment=CONFIG_CENTER_ENV_PATH="/etc/config-center/.env",PATH="/opt/miniconda3/bin"
