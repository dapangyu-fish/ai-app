; 部署到 /etc/supervisor/conf.d/user-center.conf
; 然后：supervisorctl reread && supervisorctl update && supervisorctl restart user-center

[program:user-center]
command=/opt/miniconda3/bin/gunicorn -c /root/ai-app/user_center/gunicorn_conf.py app:app
directory=/root/ai-app/user_center
user=root
autostart=true
autorestart=true
stdout_logfile=/var/log/user-center/user-center.log
stderr_logfile=/var/log/user-center/user-center-error.log
environment=USER_CENTER_ENV_PATH="/etc/user-center/.env",PATH="/opt/miniconda3/bin",PYTHONUNBUFFERED="1"
