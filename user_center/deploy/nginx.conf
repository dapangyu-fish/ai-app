# 部署到 /etc/nginx/conf.d/user-center.conf
# 然后：nginx -t && systemctl reload nginx

server {
    listen 443 ssl;
    server_name user-center.dapangyu.work;
    ssl_certificate /etc/ssl/dapangyu.work/dapangyu.work.crt;
    ssl_certificate_key /etc/ssl/dapangyu.work/dapangyu.work.key;

    # admin 工具，body 不大
    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:8089;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }
}
