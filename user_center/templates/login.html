<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Center · 登录</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang SC", sans-serif;
      background: #0f172a;
      color: #e2e8f0;
    }
    .card {
      width: 360px;
      padding: 32px;
      background: #1e293b;
      border-radius: 12px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.4);
    }
    h1 { margin: 0 0 4px 0; font-size: 22px; }
    .subtitle { margin: 0 0 24px 0; font-size: 13px; color: #94a3b8; }
    label { display: block; font-size: 12px; color: #94a3b8; margin: 14px 0 6px; }
    input[type=text], input[type=password] {
      width: 100%; padding: 10px 12px; background: #0f172a; border: 1px solid #334155;
      color: #e2e8f0; border-radius: 6px; font-size: 14px; font-family: inherit;
    }
    input:focus { outline: none; border-color: #38bdf8; }
    button {
      width: 100%; margin-top: 24px; padding: 11px;
      background: #38bdf8; color: #0f172a; border: none; border-radius: 6px;
      font-size: 14px; font-weight: 600; cursor: pointer;
    }
    button:hover { background: #0ea5e9; }
    .err { margin-top: 16px; padding: 10px; background: #7f1d1d; border-radius: 6px; font-size: 13px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>User Center</h1>
    <p class="subtitle">Supabase 用户管理后台</p>
    <form method="POST" action="/login">
      <input type="hidden" name="next" value="{{ next }}">
      <label for="username">账号</label>
      <input type="text" id="username" name="username" autofocus autocomplete="username">
      <label for="password">密码</label>
      <input type="password" id="password" name="password" autocomplete="current-password">
      <button type="submit">登录</button>
    </form>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
  </div>
</body>
</html>
